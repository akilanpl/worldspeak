name: ci

on:
  push:
    branches: [main, feat/meta-inference-core]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: worldspeak_phase2
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:db
      - run: pnpm check:schema
      - run: pnpm build
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm test:e2e
      - run: pnpm test:e2e --grep "reconstructed Spark chair"
        env:
          # Synthetic browser session only; no real project/key or hosted access.
          WORLDSPEAK_MOCK_AUTH_E2E: "1"
          NEXT_PUBLIC_SUPABASE_URL: https://worldspeak-e2e.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-public-browser-test-key
      - run: pnpm check:secrets
