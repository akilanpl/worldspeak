name: guest-demo-recording
on:
  pull_request:
    paths:
      - tooling/demo/**
      - .github/workflows/demo-recording.yml
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: node tooling/demo/record.mjs
      - name: Validate actual WebM duration and receipt
        run: |
          ffprobe -v error -show_entries format=duration -of json demo-artifacts/worldspeak-guest-demo.webm > demo-artifacts/video-probe.json
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const m=JSON.parse(readFileSync('demo-artifacts/manifest.json'));
          const p=JSON.parse(readFileSync('demo-artifacts/video-probe.json'));
          const duration=Number(p.format.duration);
          if(m.status!=='RECORDED_GUEST_JOURNEY'||m.violations.length||m.videoBytes<10000||!Number.isFinite(duration)||duration<=0||duration>180) throw Error('Demo artifact acceptance failed');
          console.log(JSON.stringify({status:m.status,durationSeconds:duration,bytes:m.videoBytes}));
          JS
      - name: Produce MP4 and review storyboard from verified footage
        run: |
          ffmpeg -hide_banner -loglevel error -i demo-artifacts/worldspeak-guest-demo.webm -an -c:v libx264 -preset fast -crf 23 -pix_fmt yuv420p demo-artifacts/worldspeak-guest-demo.mp4
          ffmpeg -hide_banner -loglevel error -i demo-artifacts/worldspeak-guest-demo.webm -vf 'fps=1/20,scale=384:-1,tile=3x3' -frames:v 1 demo-artifacts/storyboard.png
          sha256sum demo-artifacts/worldspeak-guest-demo.webm demo-artifacts/worldspeak-guest-demo.mp4 > demo-artifacts/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worldspeak-guest-demo-${{ github.sha }}
          path: demo-artifacts/
          retention-days: 7
          if-no-files-found: error
